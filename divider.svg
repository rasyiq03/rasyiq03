<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 10" width="1000" height="10" preserveAspectRatio="none" role="img" aria-label="divider">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#00ff9c" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#00ff9c" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#00ff9c" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#00ff9c" stop-opacity="0"/>
      <stop offset="45%"  stop-color="#7dffcf" stop-opacity="1"/>
      <stop offset="50%"  stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="55%"  stop-color="#7dffcf" stop-opacity="1"/>
      <stop offset="100%" stop-color="#00ff9c" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="0" y="4" width="1000" height="2" fill="url(#base)"/>

  <rect x="-300" y="3.5" width="300" height="3" fill="url(#pulse)">
    <animate attributeName="x" from="-300" to="1000" dur="3.2s" repeatCount="indefinite"/>
  </rect>

  <g fill="#00ff9c">
    <rect x="0"   y="2" width="2" height="6" opacity="0.8"/>
    <rect x="998" y="2" width="2" height="6" opacity="0.8"/>
  </g>
</svg>
